services:
  - type: web
    name: sofia-ai-agency
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        value: sqlite:///./sofia.db
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_AGENT_PHONE
        value: "5493435720312"
      - key: WHATSAPP_ALERT_PHONE
        value: "5493434536447"
      - key: WHATSAPP_API_URL
        value: https://gate.whapi.cloud
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_SSL_TLS
        value: "false"
      - key: SECRET_KEY
        generateValue: true
