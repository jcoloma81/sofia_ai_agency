name: "🖥️ Windows Laboratorio RDP"

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: "Ngrok Auth Token (dashboard.ngrok.com)"
        required: false
        type: string
        default: ""

jobs:
  windows_rdp:
    name: "Iniciar Windows Real con Escritorio Remoto"
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Habilitar RDP y Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0

      - name: 2. Configurar Clave de Acceso Administrador
        shell: powershell
        run: |
          net user runneradmin "SuperActualizador2026!" /active:yes

      - name: 3. Descargar y Descomprimir el Actualizador en el Escritorio
        shell: powershell
        run: |
          $desktop = "C:\Users\runneradmin\Desktop"
          try {
            Write-Host "Descargando Súper Actualizador PRO al Escritorio de Windows..."
            Invoke-WebRequest -Uri "https://sof-ia.site/descargar-actualizador" -OutFile "$desktop\PAQUETE_ACTUALIZADOR.zip"
            Expand-Archive -Path "$desktop\PAQUETE_ACTUALIZADOR.zip" -DestinationPath "$desktop\SuperActualizadorPRO" -Force
            Write-Host "✅ Paquete descomprimido en el Escritorio: $desktop\SuperActualizadorPRO"
          } catch {
            Write-Host "Aviso: Puedes descargarlo manualmente desde Edge en el escritorio."
          }

      - name: 4. Descargar y Configurar Ngrok
        shell: powershell
        run: |
          $token = "${{ inputs.ngrok_token }}".Trim()
          if (-not $token) {
            $token = "${{ secrets.NGROK_AUTH_TOKEN }}".Trim()
          }
          if (-not $token) {
            Write-Error "Falta el Ngrok Auth Token. Ingresalo al ejecutar el workflow en 'Run workflow' o configuralo en Secrets como NGROK_AUTH_TOKEN."
            exit 1
          }

          New-Item -ItemType Directory -Path "C:\ngrok" -Force | Out-Null
          Write-Host "Descargando Ngrok oficial..."
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "C:\ngrok\ngrok.zip"
          Expand-Archive -Path "C:\ngrok\ngrok.zip" -DestinationPath "C:\ngrok" -Force
          & C:\ngrok\ngrok.exe config add-authtoken $token
          Write-Host "✅ Ngrok autenticado y listo."

      - name: 5. Iniciar Tunel RDP y Mantener Sesion Activa
        shell: powershell
        run: |
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          
          $addr = ""
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction SilentlyContinue
              if ($resp -and $resp.tunnels -and $resp.tunnels.Count -gt 0) {
                $raw_url = $resp.tunnels[0].public_url
                $addr = $raw_url -replace "tcp://", ""
                break
              }
            } catch {}
          }

          if (-not $addr) {
            Write-Error "No se pudo obtener la direccion del tunel Ngrok. Revisa que tu Auth Token sea valido."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "🚀 ¡WINDOWS SERVER 100% REAL ESTA ACTIVO CON NGROK!"
          Write-Host "=========================================================="
          Write-Host ""
          Write-Host "👉 DIRECCION PARA REMMINA:  $addr"
          Write-Host "👉 USUARIO:                 runneradmin"
          Write-Host "👉 CONTRASENA:              SuperActualizador2026!"
          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "Paso a paso en Remmina:"
          Write-Host "1. En tu Linux abri Remmina."
          Write-Host "2. Protocolo: RDP"
          Write-Host "3. Servidor:  $addr"
          Write-Host "4. Usuario:   runneradmin"
          Write-Host "5. Clave:     SuperActualizador2026!"
          Write-Host "=========================================================="
          Write-Host ""

          # Mantener la máquina viva hasta 6 horas
          $max_minutos = 360
          for ($m = 1; $m -le $max_minutos; $m++) {
            Start-Sleep -Seconds 60
            if ($m % 15 -eq 0) {
              Write-Host "Windows activo ($m de $max_minutos minutos transcurridos)."
            }
          }
