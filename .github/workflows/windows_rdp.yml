name: "🖥️ Windows Laboratorio RDP"

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: "Tailscale Auth Key (dejar por defecto o pegar nueva)"
        required: false
        default: "tskey-auth-k8qEAciuQp11CNTRL-wi4wKos8PBTDhG9bYeY1CTpVyZTXF4HL"

jobs:
  windows_rdp:
    name: "Iniciar Windows Real con Escritorio Remoto"
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Habilitar RDP y Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0

      - name: 2. Configurar Clave de Acceso Administrador
        shell: powershell
        run: |
          net user runneradmin "SuperActualizador2026!" /active:yes

      - name: 3. Descargar y Descomprimir el Actualizador en el Escritorio
        shell: powershell
        run: |
          $desktop = "C:\Users\runneradmin\Desktop"
          try {
            Write-Host "Descargando Súper Actualizador PRO al Escritorio de Windows..."
            Invoke-WebRequest -Uri "https://sof-ia.site/descargar-actualizador" -OutFile "$desktop\PAQUETE_ACTUALIZADOR.zip"
            Expand-Archive -Path "$desktop\PAQUETE_ACTUALIZADOR.zip" -DestinationPath "$desktop\SuperActualizadorPRO" -Force
            Write-Host "✅ Paquete descomprimido en el Escritorio: $desktop\SuperActualizadorPRO"
          } catch {
            Write-Host "Aviso: Puedes descargarlo manualmente desde Edge en el escritorio."
          }

      - name: 4. Conectar a Red Privada Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ inputs.tailscale_key }}
          version: latest

      - name: 5. Mostrar IP de Windows y Mantener Sesion Activa
        shell: powershell
        run: |
          $ip = ""
          for ($i = 0; $i -lt 15; $i++) {
            try {
              $ip = (tailscale ip -4).Trim()
              if ($ip) { break }
            } catch {}
            Start-Sleep -Seconds 2
          }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "🚀 ¡WINDOWS SERVER CONECTADO A TU RED TAILSCALE!"
          Write-Host "=========================================================="
          Write-Host ""
          Write-Host "👉 IP PRIVADA PARA REMMINA:  $ip"
          Write-Host "👉 USUARIO:                  runneradmin"
          Write-Host "👉 CONTRASENA:               SuperActualizador2026!"
          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "Paso a paso en Remmina:"
          Write-Host "1. En tu Linux abri Remmina."
          Write-Host "2. Protocolo: RDP"
          Write-Host "3. Servidor:  $ip"
          Write-Host "4. Usuario:   runneradmin"
          Write-Host "5. Clave:     SuperActualizador2026!"
          Write-Host "=========================================================="
          Write-Host ""

          # Mantener la máquina viva hasta 6 horas
          $max_minutos = 360
          for ($m = 1; $m -le $max_minutos; $m++) {
            Start-Sleep -Seconds 60
            if ($m % 15 -eq 0) {
              Write-Host "Windows activo ($m de $max_minutos minutos transcurridos)."
            }
          }
