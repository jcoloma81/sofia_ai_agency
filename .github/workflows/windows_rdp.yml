name: "🖥️ Windows Laboratorio RDP"

on:
  workflow_dispatch:

jobs:
  windows_rdp:
    name: "Iniciar Windows Real con Escritorio Remoto"
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Habilitar RDP y Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0

      - name: 2. Configurar Clave de Acceso
        shell: powershell
        run: |
          net user runneradmin "SuperActualizador2026!" /active:yes

      - name: 3. Descargar y Descomprimir el Actualizador en el Escritorio
        shell: powershell
        run: |
          $desktop = "C:\Users\runneradmin\Desktop"
          try {
            Write-Host "Descargando Súper Actualizador PRO al Escritorio de Windows..."
            Invoke-WebRequest -Uri "https://sofia-ai-agency.onrender.com/descargar-actualizador" -OutFile "$desktop\PAQUETE_ACTUALIZADOR.zip"
            Expand-Archive -Path "$desktop\PAQUETE_ACTUALIZADOR.zip" -DestinationPath "$desktop\SuperActualizadorPRO" -Force
            Write-Host "✅ Paquete descomprimido en el Escritorio: $desktop\SuperActualizadorPRO"
          } catch {
            Write-Host "Aviso: Puedes descargarlo manualmente desde Edge en el escritorio."
          }

      - name: 4. Descargar Herramienta de Tunel Bore
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "C:\tunnel" -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile "C:\tunnel\bore.zip"
          Expand-Archive -Path "C:\tunnel\bore.zip" -DestinationPath "C:\tunnel" -Force
          Write-Host "✅ Bore listo en C:\tunnel\bore.exe"

      - name: 5. Iniciar Tunel RDP en Primer Plano (Activo hasta 6 Horas)
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "🚀 ¡WINDOWS SERVER 100% REAL ESTA ACTIVO!"
          Write-Host "=========================================================="
          Write-Host "👉 USUARIO:     runneradmin"
          Write-Host "👉 CONTRASENA:  SuperActualizador2026!"
          Write-Host ""
          Write-Host "👉 MIRA LA SIGUIENTE LINEA QUE DICE 'listening at bore.pub:XXXXX'"
          Write-Host "   Copia esa direccion exactamente y pegala en Remmina."
          Write-Host "=========================================================="
          Write-Host ""

          # Ejecutar bore en primer plano para que GitHub Actions NO mate el proceso
          & C:\tunnel\bore.exe local 3389 --to bore.pub
