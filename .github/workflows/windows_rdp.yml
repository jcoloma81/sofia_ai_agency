name: "🖥️ Windows Laboratorio RDP"

on:
  workflow_dispatch:

jobs:
  windows_rdp:
    name: "Iniciar Windows Real con Escritorio Remoto"
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Habilitar RDP y Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0

      - name: 2. Configurar Clave de Acceso Administrador
        shell: powershell
        run: |
          net user runneradmin "SuperActualizador2026!" /active:yes

      - name: 3. Descargar y Descomprimir el Actualizador en el Escritorio
        shell: powershell
        run: |
          $desktop = "C:\Users\runneradmin\Desktop"
          try {
            Write-Host "Descargando Súper Actualizador PRO al Escritorio de Windows..."
            Invoke-WebRequest -Uri "https://sof-ia.site/descargar-actualizador" -OutFile "$desktop\PAQUETE_ACTUALIZADOR.zip"
            Expand-Archive -Path "$desktop\PAQUETE_ACTUALIZADOR.zip" -DestinationPath "$desktop\SuperActualizadorPRO" -Force
            Write-Host "✅ Paquete descomprimido en el Escritorio: $desktop\SuperActualizadorPRO"
          } catch {
            Write-Host "Aviso: Puedes descargarlo manualmente desde Edge en el escritorio."
          }

      - name: 4. Iniciar Tunel TCP Directo (Sin Cuentas ni Tarjetas)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "C:\tunnel" -Force | Out-Null
          
          # Iniciar tunel TCP SSH con Pinggy en segundo plano
          Start-Process -FilePath "ssh" -ArgumentList "-T -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:127.0.0.1:3389 tcp@a.pinggy.io" -RedirectStandardOutput "C:\tunnel\pinggy.log" -RedirectStandardError "C:\tunnel\pinggy_err.log"

          $addr = ""
          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "C:\tunnel\pinggy.log") {
              $log = Get-Content "C:\tunnel\pinggy.log" -Raw
              if ($log -match "tcp://([^\s]+)") {
                $addr = $matches[1].Trim()
                break
              }
            }
          }

          if (-not $addr) {
            Write-Host "Logs de salida:"
            Get-Content "C:\tunnel\pinggy.log" -ErrorAction SilentlyContinue
            Get-Content "C:\tunnel\pinggy_err.log" -ErrorAction SilentlyContinue
            Write-Error "No se pudo iniciar el túnel TCP."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "🚀 ¡WINDOWS SERVER 100% REAL ESTA ACTIVO!"
          Write-Host "=========================================================="
          Write-Host ""
          Write-Host "👉 DIRECCION PARA REMMINA:  $addr"
          Write-Host "👉 USUARIO:                 runneradmin"
          Write-Host "👉 CONTRASENA:              SuperActualizador2026!"
          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "Paso a paso en Remmina:"
          Write-Host "1. En tu Linux abri Remmina."
          Write-Host "2. Asegurate que el protocolo sea RDP."
          Write-Host "3. En el servidor pega: $addr"
          Write-Host "4. Usuario: runneradmin | Clave: SuperActualizador2026!"
          Write-Host "5. ¡Listo! Ya estas adentro del escritorio de Windows."
          Write-Host "=========================================================="
          Write-Host ""

          # Mantener la sesión activa
          $max_minutos = 360
          for ($m = 1; $m -le $max_minutos; $m++) {
            Start-Sleep -Seconds 60
            if ($m % 15 -eq 0) {
              Write-Host "Windows activo ($m de $max_minutos minutos transcurridos)."
            }
          }
